name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; don't cancel one that is in progress
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_URL: https://www.thesportsdb.com/api/v1/json/123/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Type-check
        run: npm run type-check

      # Pages serves the app from /<repo-name>/, so assets and routes need that base path.
      # Calls build-only directly: `npm run build` (run-p) doesn't forward the --base argument.
      - name: Build
        run: npm run build-only -- --base=${{ steps.pages.outputs.base_path }}/

      # GitHub Pages has no SPA fallback: serve index.html for unknown routes (e.g. a refresh on a deep link)
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
