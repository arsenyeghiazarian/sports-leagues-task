name: CI

on:
  # Every PR, including stacked PRs that target another feature branch
  pull_request:
  push:
    branches: [develop, main]

# Cancel a running check when new commits are pushed to the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    env:
      # Public free-tier API key, same value as .env-example
      VITE_BASE_URL: https://www.thesportsdb.com/api/v1/json/123/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Check-only variants of `npm run lint` (which auto-fixes)
      - name: Lint (oxlint)
        run: npx oxlint . --deny-warnings

      - name: Lint (ESLint)
        run: npx eslint . --max-warnings=0

      - name: Check formatting
        run: npm run format:check

      # Runs vue-tsc type-check and the Vite production build
      - name: Type-check & build
        run: npm run build
